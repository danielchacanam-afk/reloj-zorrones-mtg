<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121520">
<title>Reloj Zorrones MTG</title>
<style>
  :root {
    color-scheme: dark;
    font-family: system-ui, sans-serif;
    background: #10131d;
    color: #f4ede3;
    --gold: #ffd575;
    --line: #677287;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: radial-gradient(ellipse at 96% 0%, #463158, transparent 34%),
      radial-gradient(ellipse at 0% 100%, #253d58, transparent 44%),
      radial-gradient(ellipse at 100% 100%, #252e49, transparent 42%), #10131d;
  }
  main {
    width: min(100%, 100rem);
    min-height: 100dvh;
    margin: auto;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    gap: clamp(.55rem, 2vmin, 1.25rem);
    padding: clamp(.65rem, 2.5vmin, 1.75rem);
  }
  .board {
    --turn-button-size: clamp(8.25rem, 24vmin, 13.5rem);
    position: relative;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: clamp(.55rem, 2vmin, 1.5rem);
    min-height: 0;
  }
  .next-turn {
    position: absolute;
    z-index: 2;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: grid;
    place-items: center;
    width: var(--turn-button-size);
    aspect-ratio: 1;
    padding: 0;
    border: 2px solid #7ddcff;
    border-radius: 50%;
    background: #152744;
    color: #c0efff;
    animation: turn-pulse 1.8s ease-in-out infinite alternate;
    box-shadow: 0 0 0 .2rem #10131d, 0 0 .65rem #44bfff;
  }
  .next-turn:not(:disabled):hover { background: #223e68; }
  .next-turn:disabled { opacity: 1; color: #8cabca; }
  @keyframes turn-pulse {
    from { box-shadow: 0 0 0 .2rem #10131d, 0 0 .55rem #44bfff8c; }
    to { box-shadow: 0 0 0 .2rem #10131d, 0 0 1.3rem #50cbff, inset 0 0 .85rem #439cf97a; }
  }
  .turn-lightning {
    position: absolute;
    inset: -10%;
    display: grid;
    place-items: center;
    border-radius: 50%;
    opacity: 0;
    background: radial-gradient(ellipse, #f1feff 0%, #86e8ff 27%, #389eff80 54%, transparent 73%);
    filter: drop-shadow(0 0 .65rem #5ccaff);
    pointer-events: none;
  }
  .turn-lightning::before {
    content: '';
    width: 85%;
    height: 65%;
    background: #f5fdff;
    clip-path: polygon(0 69%, 38% 39%, 31% 57%, 65% 30%, 55% 55%, 100% 10%, 68% 58%, 77% 57%, 36% 88%, 46% 64%);
  }
  @media (prefers-reduced-motion: reduce) {
    .next-turn { animation: none; }
  }
  .clock-icon {
    position: relative;
    width: 50%;
    aspect-ratio: 1;
    border: clamp(2px, .7vmin, 6px) solid currentColor;
    border-radius: 50%;
  }
  .clock-icon::before {
    content: '';
    position: absolute;
    top: 19%;
    left: calc(50% - clamp(1px, .35vmin, 3px));
    width: 28%;
    height: 31%;
    border: solid currentColor;
    border-width: 0 0 clamp(2px, .7vmin, 6px) clamp(2px, .7vmin, 6px);
  }
  .seat {
    position: relative;
    padding: 0;
    display: grid;
    place-items: stretch;
    min-width: 0;
    min-height: 0;
    text-align: initial;
    border: 1px solid var(--line);
    border-radius: clamp(.65rem, 2vmin, 1.3rem);
    background: linear-gradient(145deg, #212736, #11151e 62%, #202635);
    box-shadow: inset 0 0 1.3rem #080b1470, 0 .3rem .85rem #07091470;
  }
  .seat[aria-disabled="true"] { cursor: default; }
  .seat.active {
    border-color: var(--gold);
    background: radial-gradient(ellipse at 0% 100%, #765120, transparent 56%),
      radial-gradient(ellipse at 100% 100%, #554017, transparent 56%), #211e1b;
    box-shadow: inset 0 0 1.25rem #e5a13465, 0 0 0 1px var(--gold), 0 0 1rem #f5af4790;
  }
  .seat.low-time::before {
    content: '';
    position: absolute;
    inset: 0;
    border: 2px solid #ff5050;
    border-radius: inherit;
    background: radial-gradient(ellipse at center, transparent 25%, #ed142853);
    box-shadow: inset 0 0 1.15rem #ff3838;
    opacity: var(--alert-intensity);
    pointer-events: none;
    animation: low-time-pulse 1.6s ease-in-out infinite alternate;
  }
  @keyframes low-time-pulse {
    from { opacity: calc(var(--alert-intensity) * .2); }
    to { opacity: var(--alert-intensity); }
  }
  @media (prefers-reduced-motion: reduce) {
    .seat.low-time::before { animation: none; }
  }
  .seat.expired { border-color: #fb8d7f; }
  .face {
    position: relative;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    width: 100%;
    padding: clamp(.55rem, 2.8vmin, 1.9rem);
  }
  .readout {
    display: grid;
    align-self: center;
    gap: clamp(.25rem, 1.2vmin, .85rem);
  }
  .turn-history {
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 2px;
    max-height: calc(2 * var(--turn-chip-height) + 2px);
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    --turn-chip-height: clamp(1.1rem, 3.5vmin, 1.8rem);
  }
  .turn-duration {
    display: inline-grid;
    place-items: center;
    height: var(--turn-chip-height);
    padding-inline: .42em;
    border: 1px solid #cda65d;
    background: #a3772922;
    color: #ffe298;
    font-size: clamp(.65rem, 2.05vmin, 1rem);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .combat-effect {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: inherit;
    pointer-events: none;
  }
  .combat-slash {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 112%;
    height: 34%;
    opacity: 0;
    filter: drop-shadow(0 0 .45rem #a1f7ff) drop-shadow(0 0 1.25rem #46cfff);
    animation: sword-slash .72s ease-out both;
  }
  .combat-slash::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #55d9ff, #f5ffff 40%, #fff 54%, #50d7ff);
    clip-path: polygon(0 60%, 25% 51%, 38% 48%, 32% 66%, 56% 46%, 49% 35%,
      69% 39%, 63% 19%, 83% 29%, 97% 8%, 91% 44%, 100% 53%, 85% 68%,
      89% 85%, 69% 70%, 62% 92%, 60% 68%, 42% 77%, 47% 61%, 23% 71%);
  }
  .combat-flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 57% 48%, #fff 0%, #ccf8ff 17%, #66d7ff90 43%, transparent 78%);
    animation: combat-impact .34s ease-out .43s both;
  }
  @keyframes combat-impact {
    0% { opacity: 0; transform: scale(.64); }
    18% { opacity: .84; }
    100% { opacity: 0; transform: scale(1.2); }
  }
  @keyframes sword-slash {
    0% { opacity: 0; transform: translate(-86%, -25%) rotate(-13deg) scale(.2, .5); }
    24% { opacity: 1; transform: translate(-52%, -49%) rotate(-13deg) scale(1, 1); }
    48% { opacity: .9; transform: translate(-43%, -55%) rotate(-13deg) scale(1.08, .83); }
    100% { opacity: 0; transform: translate(-28%, -70%) rotate(-13deg) scale(1.2, .15); }
  }
  @keyframes show-combat-banner {
    from { opacity: 0; transform: translate(-50%, -50%) scale(.94); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .combat-effect { display: none; }
    .combat-banner { animation: none !important; }
  }
  .combat-banner {
    position: absolute;
    inset: 50% auto auto 50%;
    transform: translate(-50%, -50%);
    width: max-content;
    max-width: calc(100% - 1.1rem);
    padding: .45em .75em;
    border: 1px solid var(--gold);
    border-radius: .55rem;
    background: #24202d;
    color: var(--gold);
    text-align: center;
    font-size: clamp(.8rem, 3.3vmin, 1.85rem);
    font-weight: 800;
    box-shadow: 0 .25rem 1rem #080a11b0;
    pointer-events: none;
    animation: show-combat-banner .22s ease-out .49s both;
  }
  .opposite .face { transform: rotate(180deg); }
  .top-wide { grid-area: 1 / 1 / 2 / 3; }
  .bottom-wide { grid-area: 2 / 1 / 3 / 3; }
  .top-wide .readout, .bottom-wide .readout { align-self: end; }
  .top-left { grid-area: 1 / 1; }
  .top-right { grid-area: 1 / 2; }
  .bottom-left { grid-area: 2 / 1; }
  .bottom-right { grid-area: 2 / 2; }
  .identity {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .3rem;
    padding-bottom: .3em;
    border-bottom: 1px solid #b7bcd347;
  }
  .name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: clamp(.8rem, 3.8vmin, 2.4rem);
    font-weight: 700;
  }
  .status {
    flex-shrink: 0;
    border-radius: .35em;
    padding: .3em .55em;
    color: #211706;
    background: var(--gold);
    font-size: clamp(.57rem, 1.8vmin, .95rem);
    font-weight: 800;
  }
  .expired .status { background: #fb8d7f; }
  .time {
    text-align: center;
    --time-color: #e1e5ee;
    color: var(--time-color);
    color: color-mix(in srgb, var(--time-color), #ff6565 var(--urgency, 0%));
    transition: color .35s linear;
    font: bold clamp(1.9rem, min(11vw, 15vmin), 8.5rem)/1 Georgia, serif;
    font-variant-numeric: lining-nums tabular-nums;
    letter-spacing: -.04em;
  }
  .active .time { --time-color: #ffe298; }
  .controls, .dialog-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: .45rem;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  .control, input, select {
    border: 1px solid #687286;
    border-radius: .55rem;
    background: #202635;
    padding: .48rem .72rem;
  }
  .control { min-height: 2.65rem; font-size: .88rem; }
  .primary { background: #503b78; border-color: #9779c8; }
  .accent { color: var(--gold); border-color: #bd8b3e; background: #34291d; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  dialog {
    width: min(92vw, 29rem);
    max-height: 90dvh;
    padding: 1.15rem;
    border: 1px solid var(--line);
    border-radius: .9rem;
    background: #181d2a;
    color: inherit;
  }
  dialog::backdrop { background: #080a11cc; }
  dialog h2 { margin: 0 0 .7rem; font: bold 1.45rem Georgia, serif; }
  dialog p { color: #d8d9e4; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; }
  label { display: grid; gap: .25rem; font-size: .84rem; }
  input, select { width: 100%; min-width: 0; }
  .dialog-actions { justify-content: flex-end; margin-top: 1rem; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .board { --turn-clearance: calc(var(--turn-button-size) / 2 + .25rem); }
  .bottom-left .face, .top-right .face { padding-inline-end: var(--turn-clearance); }
  .bottom-right .face, .top-left .face { padding-inline-start: var(--turn-clearance); }
  .bottom-left .combat-banner, .top-right .combat-banner {
    left: calc(50% - var(--turn-clearance) / 2);
  }
  .bottom-right .combat-banner, .top-left .combat-banner {
    left: calc(50% + var(--turn-clearance) / 2);
  }
  .combat-banner { max-width: calc(100% - var(--turn-clearance)); }
  .top-wide .name, .bottom-wide .name { max-width: calc(50% - var(--turn-clearance)); }
  @media (max-width: 480px) and (orientation: portrait) {
    .seat:not(.top-wide, .bottom-wide) .identity { flex-wrap: wrap; }
    .seat:not(.top-wide, .bottom-wide) .time { font-size: clamp(1.15rem, 7vw, 2.15rem); }
  }
  @media (orientation: landscape) and (max-height: 480px) {
    main { padding: .4rem .65rem; gap: .45rem; }
    .control { min-height: 2.3rem; padding: .3rem .55rem; }
    .face { padding-block: .4rem; }
    .top-wide:has(.turn-duration) .time, .bottom-wide:has(.turn-duration) .time {
      font-size: clamp(1.35rem, 8.5vmin, 3rem);
    }
  }
</style>
</head>
<body>
<main>
  <section class="board" aria-label="Relojes de los jugadores">
    <button class="next-turn" id="next-turn" type="button" title="Pasar turno" aria-label="Pasar turno" disabled>
      <span class="clock-icon" aria-hidden="true"></span>
      <span class="turn-lightning" aria-hidden="true"></span>
    </button>
  </section>
  <footer>
    <div class="controls">
      <button class="control" id="settings" title="Configuración" aria-label="Configuración">⚙</button>
      <button class="control primary" id="play">Iniciar</button>
      <button class="control" id="reset">Reiniciar partida</button>
      <button class="control accent" id="restart">Reiniciar turno</button>
      <button class="control" id="sound" aria-pressed="true">Sonido</button>
      <button class="control" id="fullscreen" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
    </div>
  </footer>
  <span class="sr-only" id="announcement" role="status"></span>
</main>
<dialog id="configuration" aria-labelledby="configuration-title">
  <form id="setup">
    <h2 id="configuration-title">Configuración</h2>
    <div class="fields">
      <label>Jugadores
        <select id="count"><option>2</option><option>3</option><option>4</option></select>
      </label>
      <label>Tiempo por jugador (min)
        <input id="minutes" type="number" min="1" max="180" required>
      </label>
      <label>Jugador inicial
        <select id="first-player"></select>
      </label>
      <label>Incremento por turno (s)
        <input id="increment" type="number" min="0" max="120" required>
      </label>
    </div>
    <p>El orden de los nombres es el orden de los turnos. Los cambios se aplican a una partida nueva.</p>
    <div class="fields" id="names"></div>
    <div class="dialog-actions">
      <button class="control" id="cancel-settings" type="button">Cancelar</button>
      <button class="control primary">Aplicar</button>
    </div>
  </form>
</dialog>
<dialog id="confirm-reset" aria-labelledby="reset-title">
  <form method="dialog">
    <h2 id="reset-title">Reiniciar partida</h2>
    <p>Todos los jugadores recuperarán su tiempo inicial.</p>
    <div class="dialog-actions">
      <button class="control" value="cancel" autofocus>Cancelar</button>
      <button class="control accent" value="reset">Reiniciar</button>
    </div>
  </form>
</dialog>
<script>
  const find = (selector) => document.querySelector(selector);
  const storageKey = 'reloj-zorrones-mtg-settings';
  const defaults = { count: 4, minutes: 10, increment: 0, names: [], sound: true, firstPlayer: 0 };
  let settings = { ...defaults };
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (saved && [2, 3, 4].includes(saved.count) &&
        Number.isInteger(saved.minutes) && saved.minutes >= 1 && saved.minutes <= 180 &&
        Number.isInteger(saved.increment) && saved.increment >= 0 && saved.increment <= 120 &&
        Array.isArray(saved.names) && saved.names.every((name) => typeof name === 'string') &&
        typeof saved.sound === 'boolean') {
      settings = { ...defaults, ...saved };
      if (!Number.isInteger(settings.firstPlayer) || settings.firstPlayer < 0 || settings.firstPlayer >= settings.count) {
        settings.firstPlayer = 0;
      }
    }
  } catch {}

  const positions = {
    2: ['bottom-wide', 'top-wide'],
    3: ['bottom-left', 'top-wide', 'bottom-right'],
    4: ['bottom-left', 'top-left', 'top-right', 'bottom-right']
  };
  let players, active, turnStart, startedAt, phase, frame, cards;
  let audio, wakeLock, requestingWakeLock = false;

  function saveSettings() {
    try { localStorage.setItem(storageKey, JSON.stringify(settings)); } catch {}
  }

  function newGame() {
    cancelAnimationFrame(frame);
    players = Array.from({ length: settings.count }, (_, index) => ({
      name: settings.names[index] || 'Jugador ' + (index + 1),
      remaining: settings.minutes * 60000
    }));
    active = settings.firstPlayer;
    turnStart = players[active].remaining;
    phase = 'ready';
    cards = players.map((player, index) => {
      const seat = document.createElement('button');
      const position = positions[settings.count][index];
      seat.type = 'button';
      seat.className = 'seat ' + position + (position.startsWith('top') ? ' opposite' : '');
      seat.innerHTML = '<span class="face"><span class="readout"><span class="identity"><span class="name"></span><span class="status"></span></span><span class="time" aria-hidden="true"></span></span><span class="turn-history" hidden></span><span class="combat-effect" aria-hidden="true" hidden><span class="combat-slash"></span><span class="combat-flash"></span></span><span class="combat-banner" hidden>Fase de Combate</span></span>';
      seat.querySelector('.name').textContent = player.name;
      seat.addEventListener('click', () => toggleCombat(index));
      return {
        seat,
        status: seat.querySelector('.status'),
        time: seat.querySelector('.time'),
        history: seat.querySelector('.turn-history'),
        combatBanner: seat.querySelector('.combat-banner'),
        combatEffect: seat.querySelector('.combat-effect')
      };
    });
    find('.board').replaceChildren(...cards.map(({ seat }) => seat), find('#next-turn'));
    update();
  }

  function remaining(now) {
    const bank = players[active].remaining;
    return phase === 'running' ? Math.max(0, bank - (now - startedAt)) : bank;
  }

  function format(ms) {
    const seconds = Math.ceil(ms / 1000);
    return String(Math.floor(seconds / 60)).padStart(2, '0') + ':' +
      String(seconds % 60).padStart(2, '0');
  }

  function paintTimes(now) {
    const initialSeconds = settings.minutes * 60;
    cards.forEach(({ seat, time }, index) => {
      const ms = index === active ? remaining(now) : players[index].remaining;
      const value = format(ms);
      if (time.textContent === value) return;
      time.textContent = value;
      const seconds = Math.ceil(ms / 1000);
      const urgency = Math.max(0, 1 - seconds / initialSeconds);
      time.style.setProperty('--urgency', 100 * urgency + '%');
      const lowTime = seconds <= 300;
      seat.classList.toggle('low-time', lowTime);
      if (lowTime) {
        const intensity = .22 + .78 * (1 - seconds / 300);
        seat.style.setProperty('--alert-intensity', intensity);
      }
    });
  }

  function update() {
    cards.forEach(({ seat, status, combatBanner, combatEffect }, index) => {
      const current = index === active;
      const canToggleCombat = current && (phase === 'running' || phase === 'combat');
      const label = current ? { ready: 'PRIMERO', running: 'EN JUEGO', combat: '', paused: 'EN PAUSA', expired: 'SIN TIEMPO' }[phase] : '';
      seat.classList.toggle('active', current);
      seat.classList.toggle('expired', current && phase === 'expired');
      seat.setAttribute('aria-disabled', String(!canToggleCombat));
      seat.tabIndex = canToggleCombat ? 0 : -1;
      const inCombat = current && phase === 'combat';
      combatBanner.hidden = !inCombat;
      combatEffect.hidden = !inCombat;
      status.textContent = label;
      status.hidden = !label;
    });
    find('#play').textContent = { ready: 'Iniciar', running: 'Pausar', paused: 'Reanudar', combat: 'En combate', expired: 'Reanudar' }[phase];
    find('#play').disabled = phase === 'expired' || phase === 'combat';
    find('#next-turn').disabled = phase !== 'running' && phase !== 'combat';
    find('#reset').disabled = phase === 'ready';
    find('#restart').disabled = phase === 'ready';
    find('#sound').setAttribute('aria-pressed', String(settings.sound));
    find('#sound').textContent = settings.sound ? 'Sonido ♪' : 'Sin sonido';
    find('#announcement').textContent = phase === 'ready' ? ''
      : players[active].name + ' · ' + (phase === 'combat' ? 'Fase de Combate' : cards[active].status.textContent);
    paintTimes(performance.now());
    syncWakeLock();
  }

  function expire() {
    cancelAnimationFrame(frame);
    players[active].remaining = 0;
    phase = 'expired';
    bell(true);
    update();
  }

  function tick(now) {
    if (remaining(now) <= 0) {
      expire();
      return;
    }
    paintTimes(now);
    frame = requestAnimationFrame(tick);
  }

  function run(now = performance.now()) {
    cancelAnimationFrame(frame);
    phase = 'running';
    startedAt = now;
    update();
    frame = requestAnimationFrame(tick);
  }

  function pause(nextPhase = 'paused') {
    const left = remaining(performance.now());
    if (left <= 0) {
      expire();
      return;
    }
    players[active].remaining = left;
    cancelAnimationFrame(frame);
    phase = nextPhase;
    update();
  }

  function toggleCombat(index) {
    if (index !== active) return;
    if (phase === 'running') {
      pause('combat');
      if (phase === 'combat') thunderSound();
    } else if (phase === 'combat') run();
  }

  function passTurn() {
    if (phase !== 'running' && phase !== 'combat') return;
    const now = performance.now();
    const left = remaining(now);
    if (left <= 0) {
      expire();
      return;
    }
    const history = cards[active].history;
    const entry = document.createElement('span');
    entry.className = 'turn-duration';
    entry.textContent = format(Math.floor((turnStart - left) / 1000) * 1000);
    entry.title = 'Turno ' + (history.childElementCount + 1);
    history.hidden = false;
    history.append(entry);
    history.scrollTop = history.scrollHeight;
    players[active].remaining = left + settings.increment * 1000;
    active = (active + 1) % players.length;
    turnStart = players[active].remaining;
    bell();
    run(now);

  }

  function enableAudio() {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!settings.sound || !Audio) return;
    try {
      audio ??= new Audio();
      if (audio.state !== 'running') audio.resume().catch(() => {});
    } catch {}
  }

  function thunderSound() {
    if (!settings.sound || audio?.state !== 'running') return;
    const now = audio.currentTime;
    const impact = now + .49;
    const duration = 1.35;
    const noise = audio.createBuffer(1, Math.ceil(audio.sampleRate * duration), audio.sampleRate);
    const samples = noise.getChannelData(0);
    for (let index = 0; index < samples.length; index++) {
      samples[index] = Math.random() * 2 - 1;
    }
    const strike = audio.createBufferSource();
    const filter = audio.createBiquadFilter();
    const strikeVolume = audio.createGain();
    strike.buffer = noise;
    filter.type = 'bandpass';
    filter.frequency.value = 2800;
    filter.Q.value = .8;
    strikeVolume.gain.setValueAtTime(.34, impact);
    strikeVolume.gain.exponentialRampToValueAtTime(.001, impact + .2);
    strike.connect(filter).connect(strikeVolume).connect(audio.destination);
    const lowpass = audio.createBiquadFilter();
    const rumble = audio.createGain();
    lowpass.type = 'lowpass';
    lowpass.frequency.setValueAtTime(580, impact);
    lowpass.frequency.exponentialRampToValueAtTime(125, impact + duration);
    rumble.gain.setValueAtTime(.64, impact);
    rumble.gain.exponentialRampToValueAtTime(.25, impact + .16);
    rumble.gain.linearRampToValueAtTime(.34, impact + .29);
    rumble.gain.exponentialRampToValueAtTime(.001, impact + duration);
    strike.connect(lowpass).connect(rumble).connect(audio.destination);
    strike.start(impact);
    strike.onended = () => {
      strike.disconnect();
      filter.disconnect();
      strikeVolume.disconnect();
      lowpass.disconnect();
      rumble.disconnect();
    };

    const bass = audio.createOscillator();
    const bassVolume = audio.createGain();
    bass.type = 'triangle';
    bass.frequency.setValueAtTime(145, impact);
    bass.frequency.exponentialRampToValueAtTime(48, impact + .62);
    bassVolume.gain.setValueAtTime(.001, impact);
    bassVolume.gain.exponentialRampToValueAtTime(.2, impact + .045);
    bassVolume.gain.exponentialRampToValueAtTime(.001, impact + .68);
    bass.connect(bassVolume).connect(audio.destination);
    bass.start(impact);
    bass.stop(impact + .68);
    bass.onended = () => { bass.disconnect(); bassVolume.disconnect(); };

    [1060, 1747, 2731, 3593].forEach((frequency, index) => {
      const ring = audio.createOscillator();
      const volume = audio.createGain();
      const end = impact + .53 - index * .085;
      ring.frequency.value = frequency;
      volume.gain.setValueAtTime(.07 / (index + 1), impact);
      volume.gain.exponentialRampToValueAtTime(.001, end);
      ring.connect(volume).connect(audio.destination);
      ring.start(impact);
      ring.stop(end);
      ring.onended = () => { ring.disconnect(); volume.disconnect(); };
    });
  }

  function bell(expired = false) {
    if (!settings.sound || audio?.state !== 'running') return;
    const now = audio.currentTime;
    const fundamental = expired ? 430 : 790;
    [1, 2.01, 2.76].forEach((partial, index) => {
      const note = audio.createOscillator();
      const volume = audio.createGain();
      const duration = .6 - index * .12;
      note.frequency.value = fundamental * partial;
      volume.gain.setValueAtTime(.19 / (index + 1), now);
      volume.gain.exponentialRampToValueAtTime(.001, now + duration);
      note.connect(volume).connect(audio.destination);
      note.start(now);
      note.stop(now + duration);
      note.onended = () => { note.disconnect(); volume.disconnect(); };
    });
  }

  async function syncWakeLock() {
    const wanted = () => (phase === 'running' || phase === 'combat') && document.visibilityState === 'visible';
    if (!wanted()) {
      const lock = wakeLock;
      wakeLock = undefined;
      if (lock) await lock.release().catch(() => {});
      return;
    }
    if (!navigator.wakeLock || wakeLock || requestingWakeLock) return;
    requestingWakeLock = true;
    try {
      const lock = await navigator.wakeLock.request('screen');
      if (!wanted()) {
        await lock.release();
        return;
      }
      wakeLock = lock;
      lock.addEventListener('release', () => {
        if (wakeLock === lock) wakeLock = undefined;
      });
    } catch {
    } finally {
      requestingWakeLock = false;
    }
  }

  const config = find('#configuration');
  const reset = find('#confirm-reset');
  const nameFields = Array.from({ length: 4 }, (_, index) => {
    const label = document.createElement('label');
    label.textContent = 'Jugador ' + (index + 1);
    const input = document.createElement('input');
    input.maxLength = 30;
    label.append(input);
    find('#names').append(label);
    return input;
  });

  function showNameFields(first = Number(find('#first-player').value)) {
    const count = Number(find('#count').value);
    const selector = find('#first-player');
    selector.replaceChildren();
    nameFields.forEach((input, index) => {
      input.parentElement.hidden = index >= count;
      if (index < count) selector.add(new Option(input.value.trim() || 'Jugador ' + (index + 1), index));
    });
    selector.value = first < count ? first : 0;
  }

  find('#settings').onclick = () => {
    if (phase === 'running') pause();
    find('#count').value = settings.count;
    find('#minutes').value = settings.minutes;
    find('#increment').value = settings.increment;
    nameFields.forEach((input, index) => { input.value = settings.names[index] || ''; });
    showNameFields(settings.firstPlayer);
    config.showModal();
  };
  find('#count').onchange = () => showNameFields();
  find('#names').oninput = () => showNameFields();
  find('#next-turn').onclick = () => {
    passTurn();
    const lightning = find('.turn-lightning');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    lightning.getAnimations().forEach((animation) => animation.cancel());
    lightning.animate([
      { opacity: .95, transform: 'scale(.68)' },
      { opacity: .9, transform: 'scale(1.03)', offset: .23 },
      { opacity: 0, transform: 'scale(1.16)' }
    ], { duration: 430, easing: 'ease-out' });
  };
  find('#cancel-settings').onclick = () => config.close();
  find('#setup').onsubmit = (event) => {
    event.preventDefault();
    settings = {
      count: Number(find('#count').value),
      minutes: Number(find('#minutes').value),
      increment: Number(find('#increment').value),
      firstPlayer: Number(find('#first-player').value),
      names: nameFields.map((input) => input.value.trim()),
      sound: settings.sound
    };
    saveSettings();
    config.close();
    newGame();
  };
  find('#play').onclick = () => {
    if (phase === 'running') pause();
    else if (phase === 'ready' || phase === 'paused') {
      enableAudio();
      run();
    }
  };
  find('#reset').onclick = () => {
    if (phase === 'running') pause();
    reset.returnValue = '';
    reset.showModal();
  };
  reset.onclose = () => { if (reset.returnValue === 'reset') newGame(); };
  find('#restart').onclick = () => {
    players[active].remaining = turnStart;
    if (phase === 'running') run();
    else {
      if (phase === 'expired') phase = 'paused';
      update();
    }
  };
  find('#sound').onclick = () => {
    settings.sound = !settings.sound;
    enableAudio();
    saveSettings();
    update();
  };

  const fullscreen = find('#fullscreen');
  fullscreen.hidden = !document.fullscreenEnabled;
  fullscreen.onclick = async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch {
      find('#announcement').textContent = 'Pantalla completa no disponible.';
    }
  };
  document.addEventListener('fullscreenchange', () => {
    const label = document.fullscreenElement ? 'Salir de pantalla completa' : 'Pantalla completa';
    fullscreen.title = label;
    fullscreen.setAttribute('aria-label', label);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && phase === 'running') {
      cancelAnimationFrame(frame);
      tick(performance.now());
    }
    syncWakeLock();
  });
  newGame();
</script>
</body>
</html>
